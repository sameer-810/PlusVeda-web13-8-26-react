<!doctype html>
<html lang="en-IN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <!--
      Every tag below is static on purpose. This is a React SPA, so anything
      rendered by JS is invisible to the crawlers and preview-scrapers that
      don't run it — WhatsApp's link preview above all, which is how a chemist
      will actually receive this page.
    -->
    <title>
      Plusveda — photograph the distributor's bill, skip the typing | Pharmacy
      billing &amp; stock software
    </title>
    <meta
      name="description"
      content="Photograph your distributor's invoice and Plusveda reads every line — batch, expiry, MRP, rate and GST. Plus GST billing, batch-wise stock and a reorder list that writes itself. Free to start."
    />
    <link rel="canonical" href="https://plusveda.app/" />
    <meta name="theme-color" content="#10A058" />

    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="Plusveda" />
    <meta
      property="og:title"
      content="Stop typing purchase bills. Photograph them."
    />
    <meta
      property="og:description"
      content="Plusveda reads your distributor's invoice — every line, with batch, expiry, MRP and GST. Billing, stock and expiry for Indian medical stores."
    />
    <meta property="og:image" content="/og.png" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <meta property="og:locale" content="en_IN" />
    <meta name="twitter:card" content="summary_large_image" />

    <link rel="icon" type="image/png" href="/icon.png" />

    <!-- Inter for everything, Plex Mono for figures. Poppins came off when the
         app dropped it: one grotesque plus one mono is the whole type system,
         and a third family is a request the page does not need. preconnect
         first so the font request doesn't wait on a fresh DNS+TLS handshake. -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <!-- Plex Mono carries every figure, label and section number on the page.
         It is the reason the design reads as a pharmacy register rather than a
         SaaS template, so it is not decoration and it is not optional. -->
    <link
      href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=IBM+Plex+Mono:wght@500;600&display=swap"
      rel="stylesheet"
    />

    <!-- No hero image to preload any more. The hero graphic is an inline SVG
         inside the JS bundle, so there is no separate image request to race —
         which is the cheapest possible LCP and the reason the two media-gated
         screenshot preloads that used to live here are gone. -->

    <script type="application/ld+json">
      {
        "@context": "https://schema.org",
        "@type": "SoftwareApplication",
        "name": "Plusveda",
        "applicationCategory": "BusinessApplication",
        "operatingSystem": "Android, Windows, Web",
        "description": "GST billing and batch-wise stock software for Indian medical stores and pharmacies.",
        "url": "https://plusveda.app/",
        "author": {
          "@type": "Organization",
          "name": "FiveM Infotech"
        }
      }
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
